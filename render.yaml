# Render Blueprint — single free-tier Web Service running Next.js + inline
# pg-boss worker. Pairs with Neon (Postgres + pgvector) and Cloudflare R2
# (S3-compatible storage).
#
# Secrets (sync: false) are filled in the Render dashboard after the first
# apply. Nothing secret lives in this file.
services:
  - type: web
    name: document-analyzer
    runtime: node
    region: singapore          # swap to singapore / frankfurt if closer
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # ── secrets — paste in the dashboard after first deploy ───────────
      - key: DATABASE_URL          # Neon pooled connection string
        sync: false
      - key: JWT_SECRET            # openssl rand -base64 32
        sync: false
      - key: GEMINI_API_KEY        # Google AI Studio
        sync: false

      # ── storage — Cloudflare R2 (S3-compatible) ───────────────────────
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT           # https://<account-id>.r2.cloudflarestorage.com
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
